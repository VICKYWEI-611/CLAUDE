name: Book Friday swim

# Runs on a schedule to grab the Friday 8:00 AM drop-in swim spot as soon as
# the booking window opens. Adjust the cron time to fire right when Markham
# opens bookings (times are UTC — see note below).
on:
  workflow_dispatch: {}      # lets you run it manually from the Actions tab
  schedule:
    # Booking opens Thursday 11:00 AM Markham time (21h before Fri 8:00 AM).
    # We fire a bit EARLY and let the script wait for the exact open moment
    # (it holds until openTime, up to MAX_WAIT_MINUTES) — this absorbs the
    # few-minute delay GitHub often adds to scheduled runs.
    #
    # Cron is UTC and does NOT follow DST. 11:00 Markham =
    #   14:45 UTC  → 10:45 EDT (summer, UTC-4)  ← active line below
    #   15:45 UTC  → 10:45 EST (winter, UTC-5)  ← switch to this in winter
    - cron: "45 14 * * 4"    # Thursday, EDT (summer)
    # - cron: "45 15 * * 4"  # Thursday, EST (winter)

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Book the swim spot
        env:
          PM_EMAIL: ${{ secrets.PM_EMAIL }}
          PM_PASSWORD: ${{ secrets.PM_PASSWORD }}
          # Uncomment / add as repository secrets or vars to override defaults:
          # SESSION_KEYWORDS: ${{ vars.SESSION_KEYWORDS }}
          # OPEN_HOURS_BEFORE: ${{ vars.OPEN_HOURS_BEFORE }}
          HEADLESS: "1"
          MAX_WAIT_MINUTES: "45"   # cover early fire + GitHub's scheduling delay
        run: node book-swim.mjs

      - name: Upload screenshots (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
